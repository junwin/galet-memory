[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "galet-memory"
version = "0.1.26"
description = "Provider-neutral memory abstractions and implementations for agent applications"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "junwin", email = "jdunwin@gmail.com" }]
keywords = ["memory", "embeddings", "episodic", "vector"]
dependencies = ["galet>=0.1.26", "PyYAML>=6", "jsonschema>=4.18"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
vec = ["sqlite-vec>=0.1.9"]
test = ["pytest>=8"]

[project.scripts]
galet-memory-reembed = "galet_memory.examples.reembed_missing_profile:main"
galet-memory-integration = "galet_memory.examples.integration_runner:main"
galet-memory-embeddings = "galet_memory.examples.embedding_cli:main"
galet-memory-configured = "galet_memory.examples.configured_memory:main"
galet-memory-episodic = "galet_memory.examples.episodic_cli:main"
galet-memory-digest-road-test = "galet_memory.examples.digest_road_test:main"
galet-memory-semantic-road-test = "galet_memory.examples.semantic_road_test:main"
galet-memory-procedural = "galet_memory.examples.procedural_cli:main"
galet-memory-working-road-test = "galet_memory.examples.working_road_test:main"
galet-memory-keywords-road-test = "galet_memory.examples.keywords_road_test:main"

[project.urls]
Homepage = "https://github.com/junwin/galet-memory"
Repository = "https://github.com/junwin/galet-memory"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
galet_memory = ["configuration.schema.json", "examples/config/*.json", "schema/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
